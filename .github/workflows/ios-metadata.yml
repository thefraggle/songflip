name: iOS – Upload Release Notes & Store Metadata

# Manual trigger: run after creating a new version in App Store Connect.
# Generates multi-language release notes, keywords, and store metadata and uploads them via Fastlane deliver.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upload-metadata:
    name: Generate & Upload iOS Store Metadata
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install deep-translator==1.11.4

      - name: Generate iOS Store Listings (fastlane/metadata)
        run: |
          python3 scripts/generate_ios_store_listings.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@922ebc4c5262cd14e07bb0e1db020984b6c064fe # v1.226.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Upload Metadata to App Store Connect via Fastlane deliver
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          bundle exec fastlane upload_metadata --verbose
