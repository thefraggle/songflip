name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-kmp-and-android:
    name: Test KMP Core & Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Fetch ShazamKit Android SDK (if token configured)
        env:
          SONGFLIP_API_READ_TOKEN: ${{ secrets.SONGFLIP_API_READ_TOKEN }}
        run: |
          mkdir -p app/libs
          if [ -n "$SONGFLIP_API_READ_TOKEN" ]; then
            echo "Fetching proprietary ShazamKit AAR from private backend repository..."
            curl -s -f -L \
              -H "Authorization: Bearer $SONGFLIP_API_READ_TOKEN" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/thefraggle/songflip-api/contents/vendor/shazamkit-android-release.aar" \
              -o app/libs/shazamkit-android-release.aar || echo "Download failed, falling back to open-source stub mode."
          fi
          if [ -f "app/libs/shazamkit-android-release.aar" ]; then
            echo "✓ ShazamKit Android SDK successfully restored."
          else
            echo "ℹ️ Building in open-source stub mode."
          fi

      - name: Run KMP Core & Android Unit Tests
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m\""
        run: |
          ./gradlew :shared:testDebugUnitTest :app:testDebugUnitTest --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: test-results-android
          path: |
            shared/build/reports/tests/
            app/build/reports/tests/
          retention-days: 7

  test-kmp-ios:
    name: Test KMP iOS Simulator
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run KMP iOS Simulator Unit Tests
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m\""
        run: |
          ./gradlew :shared:iosSimulatorArm64Test --no-daemon

