name: Build & Release Android APK & AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          fi

      - name: Build Signed Release APK & AAB Bundle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m\""
          SIGNING_KEYSTORE_PATH: /tmp/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
          APTABASE_HOST: ${{ secrets.APTABASE_HOST }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-release}"
          if [ -f /tmp/release.keystore ]; then
            ./gradlew :app:assembleRelease --no-daemon
            ./gradlew :app:bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "dist/songflip-${VERSION}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "dist/songflip-${VERSION}.aab"
          else
            ./gradlew :app:assembleDebug :app:bundleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "dist/songflip-${VERSION}.apk"
            cp app/build/outputs/bundle/debug/app-debug.aab "dist/songflip-${VERSION}.aab"
          fi

      - name: Upload Build Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: songflip-binaries
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 -c "
          import re
          content = open('CHANGELOG.md').read()
          pattern = r'## \[' + re.escape('$VERSION') + r'\].*?(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              body = match.group(0).split('\n', 1)[1].strip()
              open('release_notes.md', 'w').write(body)
          else:
              open('release_notes.md', 'w').write('Release $VERSION')
          "

      - name: Attach APK & AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.aab
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Play Store Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pip install deep-translator
          python3 scripts/generate_whatsnew.py "${GITHUB_REF_NAME}"

      - name: Deploy AAB to Google Play Console (Closed Testing - Alpha)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: de.goork.songflip
          releaseFiles: dist/*.aab
          track: alpha
          status: completed
          whatsNewDirectory: distribution/whatsnew
