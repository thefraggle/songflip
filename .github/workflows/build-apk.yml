name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/android-sdk:34

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Gradle Permissions
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          fi

      - name: Build Signed Release APK
        env:
          SIGNING_KEYSTORE_PATH: /tmp/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-release}"
          if [ -f /tmp/release.keystore ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "dist/songflip-${VERSION}.apk"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "dist/songflip-${VERSION}.apk"
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: songflip-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 -c "
          import re
          content = open('CHANGELOG.md').read()
          pattern = r'## \[' + re.escape('$VERSION') + r'\].*?(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              body = match.group(0).split('\n', 1)[1].strip()
              open('release_notes.md', 'w').write(body)
          else:
              open('release_notes.md', 'w').write('Release $VERSION')
          "

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
