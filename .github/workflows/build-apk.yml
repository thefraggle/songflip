name: Build & Release Android APK & AAB

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          fi

      - name: Fetch ShazamKit Android SDK (if token configured)
        env:
          SONGFLIP_API_READ_TOKEN: ${{ secrets.SONGFLIP_API_READ_TOKEN }}
        run: |
          mkdir -p app/libs
          if [ -n "$SONGFLIP_API_READ_TOKEN" ]; then
            echo "Fetching proprietary ShazamKit AAR from private backend repository..."
            curl -s -f -L \
              -H "Authorization: Bearer $SONGFLIP_API_READ_TOKEN" \
              -H "Accept: application/vnd.github.v3.raw" \
              "https://api.github.com/repos/thefraggle/songflip-api/contents/vendor/shazamkit-android-release.aar" \
              -o app/libs/shazamkit-android-release.aar || echo "Download failed, falling back to open-source stub mode."
          fi
          if [ -f "app/libs/shazamkit-android-release.aar" ]; then
            echo "✓ ShazamKit Android SDK successfully restored."
          else
            echo "ℹ️ Building in open-source stub mode."
          fi

      - name: Run Release Unit Tests Gate
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m\""
        run: |
          ./gradlew :shared:testReleaseUnitTest :app:testReleaseUnitTest --no-daemon

      - name: Build Signed Release APK & AAB Bundle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m\""
          SIGNING_KEYSTORE_PATH: /tmp/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
          APTABASE_HOST: ${{ secrets.APTABASE_HOST }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-release}"
          if [ -f /tmp/release.keystore ]; then
            ./gradlew :app:assembleRelease --no-daemon
            ./gradlew :app:bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "dist/songflip-${VERSION}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "dist/songflip-${VERSION}.aab"
          else
            ./gradlew :app:assembleDebug :app:bundleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "dist/songflip-${VERSION}.apk"
            cp app/build/outputs/bundle/debug/app-debug.aab "dist/songflip-${VERSION}.aab"
          fi

      - name: Upload Build Artifacts (APK & AAB)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: songflip-binaries
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Extract Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RAW_REF: ${{ github.ref_name }}
        run: |
          python3 -c '
          import os, re
          from pathlib import Path
          version = os.environ.get("RAW_REF", "").lstrip("v")
          content = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = r"## \[" + re.escape(version) + r"\].*?(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          if match:
              body = match.group(0).split("\n", 1)[1].strip()
              Path("release_notes.md").write_text(body, encoding="utf-8")
          else:
              Path("release_notes.md").write_text(f"Release {version}", encoding="utf-8")
          '

      - name: Attach APK & AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist/*.apk dist/*.aab \
            --title "$TAG" \
            --notes-file release_notes.md || \
          gh release upload "$TAG" dist/*.apk dist/*.aab --clobber

      - name: Prepare Play Store Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pip install deep-translator
          python3 scripts/generate_whatsnew.py "${GITHUB_REF_NAME}"
          echo "--- Verifying release notes (DE + EN) ---"
          cat distribution/whatsnew/whatsnew-de-DE || echo "No DE file"
          cat distribution/whatsnew/whatsnew-en-US || echo "No EN-US file"

      - name: Deploy AAB to Google Play Console (Internal Testing)
        if: startsWith(github.ref, 'refs/tags/') && secrets.SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@7f5b759879c088a86faf85d18779f7f14e79a086 # v1.1.4
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: de.goork.songflip
          releaseFiles: dist/*.aab
          tracks: internal
          status: completed
          whatsNewDirectory: ${{ github.workspace }}/distribution/whatsnew
