name: Build & Release iOS to TestFlight / App Store Connect

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for KMP Shared Framework)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install deep-translator

      - name: Generate iOS App Store Metadata & Release Notes
        run: |
          python3 scripts/generate_ios_store_listings.py "${GITHUB_REF_NAME:-latest}"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Select Xcode 26 (iOS 26 SDK)
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          elif [ -d "/Applications/Xcode.app" ]; then
            echo "Selecting default /Applications/Xcode.app"
            sudo xcode-select -s /Applications/Xcode.app
          fi
          echo "Selected Xcode: $(xcodebuild -version | head -n 1)"
          echo "iOS SDK Version: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build KMP XCFramework for iOS
        run: |
          ./gradlew :shared:assembleSongFlipKitReleaseXCFramework

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_PROVISION_PROFILE_SHARE_EXT_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_SHARE_EXT_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-ci-password-123' }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

            UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
            PROFILE_NAME=$(security cms -D -i "$PP_PATH" | plutil -extract Name raw -)
            echo "Provisioning Profile UUID: $UUID"
            echo "Provisioning Profile Name: $PROFILE_NAME"

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"${UUID}".mobileprovision

            echo "PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV
            echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

            if [ -n "$BUILD_PROVISION_PROFILE_SHARE_EXT_BASE64" ]; then
              PP_EXT_PATH=$RUNNER_TEMP/build_pp_ext.mobileprovision
              echo -n "$BUILD_PROVISION_PROFILE_SHARE_EXT_BASE64" | base64 --decode -o "$PP_EXT_PATH"
              UUID_EXT=$(security cms -D -i "$PP_EXT_PATH" | plutil -extract UUID raw -)
              PROFILE_EXT_NAME=$(security cms -D -i "$PP_EXT_PATH" | plutil -extract Name raw -)
              echo "Share Extension Provisioning Profile UUID: $UUID_EXT"
              echo "Share Extension Provisioning Profile Name: $PROFILE_EXT_NAME"
              cp "$PP_EXT_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"${UUID_EXT}".mobileprovision
              echo "PROVISIONING_PROFILE_EXT_UUID=$UUID_EXT" >> $GITHUB_ENV
              echo "PROVISIONING_PROFILE_EXT_NAME=$PROFILE_EXT_NAME" >> $GITHUB_ENV
            fi

            echo "HAVE_SIGNING=true" >> $GITHUB_ENV
          else
            echo "Signing secrets not configured. Building unsigned / simulator archive."
            echo "HAVE_SIGNING=false" >> $GITHUB_ENV
          fi

      - name: Build and Archive iOS App (.xcarchive)
        run: |
          if [ "$HAVE_SIGNING" = "true" ]; then
            echo "Archiving with Main Profile: $PROVISIONING_PROFILE_NAME, Ext Profile: $PROVISIONING_PROFILE_EXT_NAME"
            xcodebuild archive \
              -project iosApp/SongFlip/SongFlip.xcodeproj \
              -scheme SongFlip \
              -configuration Release \
              -archivePath $RUNNER_TEMP/SongFlip.xcarchive \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution"
          else
            xcodebuild archive \
              -project iosApp/SongFlip/SongFlip.xcodeproj \
              -scheme SongFlip \
              -configuration Release \
              -archivePath $RUNNER_TEMP/SongFlip.xcarchive \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Export IPA
        run: |
          mkdir -p dist
          cat << EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>destination</key>
            <string>export</string>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>de.goork.SongFlip</key>
              <string>${PROVISIONING_PROFILE_NAME}</string>
              <key>de.goork.SongFlip.ShareExtension</key>
              <string>${PROVISIONING_PROFILE_EXT_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          VERSION="${GITHUB_REF_NAME:-release}"
          echo "Exporting archive to IPA..."
          if xcodebuild -exportArchive \
              -archivePath $RUNNER_TEMP/SongFlip.xcarchive \
              -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
              -exportPath dist; then
            if [ -f "dist/SongFlip.ipa" ]; then
              mv dist/SongFlip.ipa "dist/songflip-${VERSION}.ipa"
              echo "✓ Successfully exported dist/songflip-${VERSION}.ipa"
            fi
          else
            echo "❌ ExportArchive failed!"
            exit 1
          fi

      - name: Upload Build Artifacts (IPA & Metadata)
        uses: actions/upload-artifact@v4
        with:
          name: songflip-ios-bundle
          path: |
            dist/*.ipa
            fastlane/metadata/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload to App Store Connect / TestFlight via xcrun altool
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && env.ASC_KEY_ID != ''
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          IPA_FILE=$(ls dist/*.ipa 2>/dev/null | head -n 1)
          if [ -n "$IPA_FILE" ] && [ -f "$IPA_FILE" ]; then
            echo "Uploading $IPA_FILE to TestFlight..."
            OUTPUT=$(xcrun altool --upload-app \
              -f "$IPA_FILE" \
              -t ios \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID" 2>&1)
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q -i "UPLOAD FAILED"; then
              echo "❌ altool upload failed!"
              exit 1
            fi
            echo "✓ Successfully uploaded to App Store Connect TestFlight!"
          else
            echo "❌ No IPA file found in dist/ to upload to TestFlight."
            exit 1
          fi

      # Best-effort: updates ASC store metadata (release notes, keywords, description, etc.) if an editable version exists
      # Re-run anytime independently via ios-metadata.yml
      - name: Upload Store Metadata to App Store Connect via Fastlane deliver
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && env.ASC_KEY_ID != ''
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          bundle exec fastlane upload_metadata
