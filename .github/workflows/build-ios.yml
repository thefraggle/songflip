name: Build & Release iOS to TestFlight / App Store Connect

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      target_action:
        description: 'Build & upload IPA + metadata, build IPA only, or sync App Store metadata only'
        required: true
        default: 'build-and-upload'
        type: choice
        options:
          - build-and-upload
          - ipa-only
          - metadata-only
      build_number:
        description: 'CFBundleVersion build number (auto = max(pbxproj, App Store Connect max + 1))'
        required: true
        default: 'auto'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: ${{ inputs.target_action == 'metadata-only' && 'ubuntu-latest' || 'macos-15' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17 (for KMP Shared Framework)
        if: ${{ inputs.target_action != 'metadata-only' }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install deep-translator==1.11.4

      - name: Generate iOS App Store Metadata & Release Notes
        run: |
          python3 scripts/generate_ios_store_listings.py "${GITHUB_REF_NAME:-latest}"

      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Select Xcode 26 (iOS 26 SDK)
        if: ${{ inputs.target_action != 'metadata-only' }}
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          elif [ -d "/Applications/Xcode.app" ]; then
            echo "Selecting default /Applications/Xcode.app"
            sudo xcode-select -s /Applications/Xcode.app
          fi
          echo "Selected Xcode: $(xcodebuild -version | head -n 1)"
          echo "iOS SDK Version: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Grant Execute Permission for Gradlew
        if: ${{ inputs.target_action != 'metadata-only' }}
        run: chmod +x gradlew

      - name: Build KMP XCFramework for iOS
        if: ${{ inputs.target_action != 'metadata-only' }}
        run: |
          ./gradlew :shared:assembleSongFlipKitReleaseXCFramework

      - name: Install Apple Certificate and Provisioning Profile
        if: ${{ inputs.target_action != 'metadata-only' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_PROVISION_PROFILE_SHARE_EXT_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_SHARE_EXT_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-ci-password-123' }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

            UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
            PROFILE_NAME=$(security cms -D -i "$PP_PATH" | plutil -extract Name raw -)
            TEAM_ID=$(security cms -D -i "$PP_PATH" | plutil -extract TeamIdentifier.0 raw - 2>/dev/null || echo "296C735W8C")
            echo "Provisioning Profile UUID: $UUID"
            echo "Provisioning Profile Name: $PROFILE_NAME"
            echo "Team ID: $TEAM_ID"

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"${UUID}".mobileprovision

            echo "PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV
            echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
            echo "DEVELOPMENT_TEAM=$TEAM_ID" >> $GITHUB_ENV

            if [ -n "$BUILD_PROVISION_PROFILE_SHARE_EXT_BASE64" ]; then
              PP_EXT_PATH=$RUNNER_TEMP/build_pp_ext.mobileprovision
              echo -n "$BUILD_PROVISION_PROFILE_SHARE_EXT_BASE64" | base64 --decode -o "$PP_EXT_PATH"
              UUID_EXT=$(security cms -D -i "$PP_EXT_PATH" | plutil -extract UUID raw -)
              PROFILE_EXT_NAME=$(security cms -D -i "$PP_EXT_PATH" | plutil -extract Name raw -)
              echo "Share Extension Provisioning Profile UUID: $UUID_EXT"
              echo "Share Extension Provisioning Profile Name: $PROFILE_EXT_NAME"
              cp "$PP_EXT_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"${UUID_EXT}".mobileprovision
              echo "PROVISIONING_PROFILE_EXT_UUID=$UUID_EXT" >> $GITHUB_ENV
              echo "PROVISIONING_PROFILE_EXT_NAME=$PROFILE_EXT_NAME" >> $GITHUB_ENV
            fi

            echo "HAVE_SIGNING=true" >> $GITHUB_ENV
          else
            echo "Signing secrets not configured. Building unsigned / simulator archive."
            echo "HAVE_SIGNING=false" >> $GITHUB_ENV
          fi

      - name: Inject iOS Secrets Config
        if: ${{ inputs.target_action != 'metadata-only' }}
        env:
          REVENUECAT_PUBLIC_KEY: ${{ secrets.REVENUECAT_APPLE_KEY || secrets.REVENUECAT_PUBLIC_KEY }}
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
          APTABASE_HOST: ${{ secrets.APTABASE_HOST }}
          SONGFLIP_BACKEND_CACHE_URL: ${{ secrets.SONGFLIP_BACKEND_CACHE_URL }}
          SONGFLIP_BACKEND_WEB_URL: ${{ secrets.SONGFLIP_BACKEND_WEB_URL }}
        run: |
          if [ "$HAVE_SIGNING" = "true" ] && [ -z "$REVENUECAT_PUBLIC_KEY" ]; then
            echo "::error::REVENUECAT_PUBLIC_KEY (or REVENUECAT_APPLE_KEY) secret is missing for signed App Store build!"
            exit 1
          fi
          if [ -n "$REVENUECAT_PUBLIC_KEY" ] || [ -n "$APTABASE_APP_KEY" ] || [ -n "$SONGFLIP_BACKEND_CACHE_URL" ] || [ -n "$SONGFLIP_BACKEND_WEB_URL" ]; then
            echo "Generating iosApp/SongFlip/Config.xcconfig from repository secrets..."
            HOST="${APTABASE_HOST:-https://api.aptabase.com}"
            ESCAPED_HOST="${HOST/\/\///\$()/}"
            ESCAPED_CACHE="${SONGFLIP_BACKEND_CACHE_URL/\/\///\$()/}"
            ESCAPED_WEB="${SONGFLIP_BACKEND_WEB_URL/\/\///\$()/}"
            cat << EOF > iosApp/SongFlip/Config.xcconfig
          REVENUECAT_PUBLIC_KEY = ${REVENUECAT_PUBLIC_KEY:-}
          APTABASE_APP_KEY = ${APTABASE_APP_KEY:-}
          APTABASE_HOST = ${ESCAPED_HOST}
          SONGFLIP_BACKEND_CACHE_URL = ${ESCAPED_CACHE:-}
          SONGFLIP_BACKEND_WEB_URL = ${ESCAPED_WEB:-}
          EOF
          else
            echo "ℹ️ No production secrets configured; building in open-source stub mode."
          fi

      - name: Resolve CFBundleVersion (auto or explicit)
        if: ${{ inputs.target_action != 'metadata-only' }}
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number || 'auto' }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_BUNDLE_ID: de.goork.SongFlip
        run: |
          node - <<'EOF'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const pbxPath = 'iosApp/SongFlip/SongFlip.xcodeproj/project.pbxproj';
          const pbx = fs.readFileSync(pbxPath, 'utf8');
          const pbxMatch = pbx.match(/CURRENT_PROJECT_VERSION\s*=\s*(\d+)\s*;/);
          const pbxBuild = pbxMatch ? Number.parseInt(pbxMatch[1], 10) : 1;

          function makeJwt() {
            const now = Math.floor(Date.now() / 1000);
            const b64u = (obj) => Buffer.from(JSON.stringify(obj)).toString('base64url');
            const header = b64u({ alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' });
            const payload = b64u({ iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 900, aud: 'appstoreconnect-v1' });
            const signingInput = `${header}.${payload}`;
            const sig = crypto.sign('sha256', Buffer.from(signingInput), {
              key: process.env.ASC_API_KEY_P8,
              dsaEncoding: 'ieee-p1363',
            });
            return `${signingInput}.${sig.toString('base64url')}`;
          }

          async function getMaxAscBuild() {
            if (!process.env.ASC_KEY_ID || !process.env.ASC_ISSUER_ID || !process.env.ASC_API_KEY_P8) {
              return 0;
            }
            try {
              const jwt = makeJwt();
              const headers = { Authorization: `Bearer ${jwt}` };
              const appRes = await fetch(`https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=${encodeURIComponent(process.env.APP_BUNDLE_ID)}`, { headers });
              if (!appRes.ok) return 0;
              const appJson = await appRes.json();
              const app = (appJson.data || []).find((a) => a.attributes?.bundleId === process.env.APP_BUNDLE_ID);
              if (!app) return 0;
              const buildsRes = await fetch(`https://api.appstoreconnect.apple.com/v1/builds?filter[app]=${app.id}&limit=100`, { headers });
              if (!buildsRes.ok) return 0;
              const buildsJson = await buildsRes.json();
              let maxBuild = 0;
              for (const b of buildsJson.data || []) {
                const n = Number.parseInt(b.attributes?.version || '0', 10);
                if (Number.isFinite(n) && n > maxBuild) maxBuild = n;
              }
              return maxBuild;
            } catch (err) {
              console.warn(`Notice: could not query ASC builds (${err.message})`);
              return 0;
            }
          }

          (async () => {
            const maxAsc = await getMaxAscBuild();
            const reqInput = (process.env.INPUT_BUILD_NUMBER || 'auto').trim();
            const explicit = Number.parseInt(reqInput, 10);
            const effectiveBuild = reqInput !== 'auto' && Number.isFinite(explicit) && explicit > 0
              ? Math.max(explicit, maxAsc + 1)
              : Math.max(pbxBuild, maxAsc + 1);

            const updatedPbx = pbx.replace(/CURRENT_PROJECT_VERSION\s*=\s*\d+\s*;/g, `CURRENT_PROJECT_VERSION = ${effectiveBuild};`);
            fs.writeFileSync(pbxPath, updatedPbx);
            fs.appendFileSync(process.env.GITHUB_ENV, `EFFECTIVE_BUILD_NUMBER=${effectiveBuild}\n`);
            console.log(`Resolved CFBundleVersion: ${effectiveBuild} (pbxproj: ${pbxBuild}, ASC max: ${maxAsc})`);
          })();
          EOF

      - name: Build and Archive iOS App (.xcarchive)
        if: ${{ inputs.target_action != 'metadata-only' }}
        run: |
          if [ "$HAVE_SIGNING" = "true" ]; then
            echo "Archiving with Main Profile: $PROVISIONING_PROFILE_NAME, Ext Profile: $PROVISIONING_PROFILE_EXT_NAME, Team: ${DEVELOPMENT_TEAM:-296C735W8C}"
            xcodebuild archive \
              -project iosApp/SongFlip/SongFlip.xcodeproj \
              -scheme SongFlip \
              -configuration Release \
              -archivePath $RUNNER_TEMP/SongFlip.xcarchive \
              DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM:-296C735W8C}" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution"
          else
            xcodebuild archive \
              -project iosApp/SongFlip/SongFlip.xcodeproj \
              -scheme SongFlip \
              -configuration Release \
              -archivePath $RUNNER_TEMP/SongFlip.xcarchive \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Export IPA
        if: ${{ env.HAVE_SIGNING == 'true' && inputs.target_action != 'metadata-only' }}
        run: |
          mkdir -p dist
          cat << EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${DEVELOPMENT_TEAM:-296C735W8C}</string>
            <key>destination</key>
            <string>export</string>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>de.goork.SongFlip</key>
              <string>${PROVISIONING_PROFILE_NAME}</string>
              <key>de.goork.SongFlip.ShareExtension</key>
              <string>${PROVISIONING_PROFILE_EXT_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          VERSION="${GITHUB_REF_NAME:-release}"
          echo "Exporting archive to IPA..."
          if xcodebuild -exportArchive \
              -archivePath $RUNNER_TEMP/SongFlip.xcarchive \
              -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
              -exportPath dist; then
            if [ -f "dist/SongFlip.ipa" ]; then
              mv dist/SongFlip.ipa "dist/songflip-${VERSION}.ipa"
              echo "✓ Successfully exported dist/songflip-${VERSION}.ipa"
            fi
          else
            echo "❌ ExportArchive failed!"
            exit 1
          fi

      - name: Upload Build Artifacts (IPA & Metadata)
        if: ${{ inputs.target_action != 'metadata-only' }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: songflip-ios-bundle-b${{ env.EFFECTIVE_BUILD_NUMBER || 'local' }}
          path: |
            dist/*.ipa
            fastlane/metadata/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload to App Store Connect / TestFlight via xcrun altool
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.target_action == 'build-and-upload') }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_API_KEY_P8" ]; then
            echo "⚠️ APP_STORE_CONNECT credentials not configured in secrets; skipping TestFlight upload."
            exit 0
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          (umask 077 && echo "$ASC_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8)

          IPA_FILE=$(ls dist/*.ipa 2>/dev/null | head -n 1)
          if [ -n "$IPA_FILE" ] && [ -f "$IPA_FILE" ]; then
            echo "Uploading $IPA_FILE to TestFlight..."
            OUTPUT=$(xcrun altool --upload-app \
              -f "$IPA_FILE" \
              -t ios \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID" 2>&1)
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q -i "UPLOAD FAILED"; then
              echo "❌ altool upload failed!"
              exit 1
            fi
            echo "✓ Successfully uploaded to App Store Connect TestFlight!"
          else
            echo "❌ No IPA file found in dist/ to upload to TestFlight."
            exit 1
          fi

      - name: Update TestFlight What to Test Notes
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.target_action == 'build-and-upload') }}
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "Skipping TestFlight notes: ASC_KEY_ID not configured"
            exit 0
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$TAG_VERSION" ]; then
            TAG_VERSION=$(grep -m1 'MARKETING_VERSION =' iosApp/SongFlip/SongFlip.xcodeproj/project.pbxproj | sed 's/.*= //;s/;//;s/ //g')
          fi
          BUILD_NUMBER="${EFFECTIVE_BUILD_NUMBER:-$(grep -m1 'CURRENT_PROJECT_VERSION =' iosApp/SongFlip/SongFlip.xcodeproj/project.pbxproj | sed 's/.*= //;s/;//;s/ //g')}"
          bundle exec fastlane set_testflight_notes version:"$TAG_VERSION" build_number:"$BUILD_NUMBER"

      - name: Upload Store Metadata to App Store Connect via Fastlane deliver
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.target_action != 'ipa-only') }}
        continue-on-error: ${{ inputs.target_action != 'metadata-only' }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "Skipping store metadata: ASC_KEY_ID not configured"
            exit 0
          fi
          bundle exec fastlane upload_metadata

      - name: Cleanup Private Keys
        if: always()
        run: |
          rm -rf ~/.appstoreconnect/private_keys
