<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=2400" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="screenshot-container">
    <div class="ambient-glow"></div>
    <div class="header-area">
      <h1 class="headline">{{s1_prefix}}<span class="accent">{{s1_accent}}</span>{{s1_suffix}}</h1>
      <p class="subline">{{s1_subline}}</p>
    </div>
    <div class="mockup-area">
      <div class="hero-container">
        <!-- Dynamic HTML Chat Bubble -->
        <div class="chat-bubble">
          <div class="chat-avatar">L</div>
          <div class="chat-content">
            <div class="chat-meta">
              <span class="chat-sender">{{s1_chat_sender}}</span>
              <span class="chat-time">{{s1_chat_time}}</span>
            </div>
            <div class="chat-message">{{s1_chat_text}}</div>
            <span class="chat-link">{{s1_chat_link}}</span>
          </div>
        </div>

        <!-- Large Hero YouTube Music Player in Unified Phone Frame -->
        <div class="hero-player-wrapper">
          <div class="phone-frame yt-player-frame">
            <!-- Status Bar -->
            <div class="status-bar">
              <div class="status-left">
                <span>12:00</span>
                <div class="yt-music-app-badge">
                  <img class="yt-music-badge-logo" src="../../public/logos/youtube_music.svg" alt="YouTube Music" />
                  <span class="yt-music-badge-text">YouTube Music</span>
                </div>
              </div>
              <div class="punch-hole"></div>
              <div class="status-battery">
                <svg viewBox="0 0 12 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 1.5C4 0.95 4.45 0.5 5 0.5H7C7.55 0.5 8 0.95 8 1.5V2H4V1.5Z" fill="#E2E8F0"/>
                  <rect x="1" y="2" width="10" height="17" rx="2.5" fill="#E2E8F0"/>
                </svg>
              </div>
            </div>

            <!-- YT Music Player Content -->
            <div class="yt-content-box">
              <img class="yt-content-img" src="../../public/mockups/content_yt_music.png" alt="YouTube Music Player" />
            </div>

            <!-- Android Bottom Gesture Bar -->
            <div class="bottom-nav-bar">
              <div class="gesture-pill"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
